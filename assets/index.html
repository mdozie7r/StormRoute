<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>StormRoute</title>
<link rel="stylesheet" href="leaflet.css">
<style>
/* Layout: full-bleed map; search card pinned top, tool rail right, bottom sheet for weather/route/nav. */
:root {
  --bg: #eef2f6;
  --panel: #ffffff;
  --panel-2: #f3f6fa;
  --fg: #142030;
  --muted: #5b6b80;
  --line: #d8e0ea;
  --accent: #1f6fff;
  --accent-fg: #ffffff;
  --route: #1f6fff;
  --route-casing: #ffffff;
  --warn: #c77700;
  --warn-bg: #fff3dc;
  --danger: #c4282a;
  --danger-bg: #fde6e6;
  --good: #1b8a4b;
  --shadow: 0 6px 24px rgba(20, 32, 48, .16), 0 1px 3px rgba(20, 32, 48, .12);
  --font: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "Roboto Condensed", Roboto, system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1119; --panel: #141c27; --panel-2: #1b2532; --fg: #e8eef6; --muted: #91a0b3;
    --line: #273445; --accent: #4d8dff; --accent-fg: #06101f; --route: #4d8dff; --route-casing: #0b1119;
    --warn: #ffb547; --warn-bg: #3a2a10; --danger: #ff6b6b; --danger-bg: #3d1717; --good: #4fd18b;
    --shadow: 0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1119; --panel: #141c27; --panel-2: #1b2532; --fg: #e8eef6; --muted: #91a0b3;
  --line: #273445; --accent: #4d8dff; --accent-fg: #06101f; --route: #4d8dff; --route-casing: #0b1119;
  --warn: #ffb547; --warn-bg: #3a2a10; --danger: #ff6b6b; --danger-bg: #3d1717; --good: #4fd18b;
  --shadow: 0 8px 28px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.35 var(--font); overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#map { position: fixed; inset: 0; background: var(--bg); }
.leaflet-container { background: var(--bg); font-family: var(--font); }
.incpin { filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); line-height: 0; }
#updateBar { position: fixed; top: var(--sat, 0); left: 0; right: 0; z-index: 1300; display: flex; align-items: center; gap: 10px; padding: 9px 14px; background: var(--accent); color: var(--accent-fg); font-size: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.28); }
#updateBar span { flex: 1; }
#updateBar button { padding: 6px 12px; border-radius: 8px; font-weight: 600; }
#updateBar #updGet { background: var(--accent-fg); color: var(--accent); }
#updateBar #updClose { background: transparent; color: var(--accent-fg); padding: 6px 8px; }
#speedHud { position: fixed; right: 12px; bottom: 180px; z-index: 900; display: flex; align-items: stretch; gap: 8px; }
#speedHud .spd { background: var(--panel); box-shadow: var(--shadow); border-radius: 14px; padding: 6px 14px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
#speedHud .spd b { font-size: 26px; font-weight: 700; }
#speedHud .spd.over b { color: var(--danger); }
#speedHud .spd span { font-size: 10px; color: var(--muted); margin-top: 3px; }
#speedHud .lim { background: #fff; border: 3px solid #1a1a1a; border-radius: 10px; padding: 3px 7px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; min-width: 44px; }
#speedHud .lim span { font-size: 7px; font-weight: 800; color: #1a1a1a; letter-spacing: .3px; }
#speedHud .lim b { font-size: 22px; font-weight: 800; color: #1a1a1a; margin-top: 2px; }
.leaflet-control-attribution { font-size: 10px; background: color-mix(in srgb, var(--panel) 80%, transparent) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: var(--muted) !important; }

/* Search card */
#search {
  position: fixed; z-index: 1000; left: 12px; right: 12px; top: calc(var(--sat) + 12px);
  background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); padding: 6px;
  display: grid; gap: 2px;
}
.field { display: flex; align-items: center; gap: 10px; padding: 0 10px; height: 46px; border-radius: 12px; }
.field + .field { border-top: 1px solid var(--line); border-radius: 0 0 12px 12px; }
.field .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.dot.from { border: 3px solid var(--accent); }
.dot.to { background: var(--danger); border-radius: 50% 50% 50% 0; transform: rotate(-45deg); }
.field input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; color: var(--fg); font: inherit; font-size: 16px; outline: none; }
.field input::placeholder { color: var(--muted); }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); flex: none; }
.icon-btn:active { background: var(--panel-2); }
#suggest { list-style: none; margin: 0; padding: 4px 0 2px; border-top: 1px solid var(--line); max-height: 46vh; overflow-y: auto; }
#suggest li { padding: 10px 12px; border-radius: 10px; display: grid; gap: 1px; }
#suggest li:active, #suggest li.sel { background: var(--panel-2); }
#suggest .t { font-weight: 500; }
#suggest .s { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Tool rail */
#rail { position: fixed; z-index: 900; right: 12px; top: calc(var(--sat) + 132px); display: grid; gap: 10px; }
.fab { width: 48px; height: 48px; border-radius: 14px; background: var(--panel); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--fg); position: relative; }
.fab.on { background: var(--accent); color: var(--accent-fg); }
.fab small { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 9px; font-weight: 700; letter-spacing: .04em; }

/* Radar timeline (past + forecast) */
#radarBar {
  position: fixed; z-index: 900; left: 12px; display: flex; align-items: center; gap: 8px;
  background: var(--panel); box-shadow: var(--shadow); border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px;
}
#radarBar .play { width: 34px; height: 34px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; }
#radarTicks { display: flex; gap: 3px; }
#radarTicks i { width: 6px; height: 14px; border-radius: 3px; background: var(--line); cursor: pointer; }
#radarTicks i.fut { opacity: .5; }
#radarTicks i.cur { background: var(--accent); opacity: 1; }
.legend { display: flex; height: 6px; width: 64px; border-radius: 3px; overflow: hidden; }
.legend span { flex: 1; }

/* Bottom sheet */
#sheet {
  position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0;
  background: var(--panel); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(var(--sab) + 14px) max(16px, env(safe-area-inset-left, 0px));
  max-height: 62vh; overflow-y: auto;
}
.grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 10px; }
.row { display: flex; align-items: center; gap: 12px; }
.spread { justify-content: space-between; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.big { font: 600 34px/1 var(--font-num); letter-spacing: -.01em; }
.mid { font: 600 22px/1.1 var(--font-num); }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.btn { height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); flex: 1; }
.btn.ghost { background: var(--panel-2); }
.btns { display: flex; gap: 10px; margin-top: 14px; }

.hours { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
.hours::-webkit-scrollbar { display: none; }
.hr { flex: none; min-width: 56px; text-align: center; display: grid; gap: 4px; justify-items: center; padding: 8px 6px; border-radius: 12px; background: var(--panel-2); font-size: 13px; }
.hr b { font: 600 16px var(--font-num); }
.hr .p { font-size: 11px; color: var(--accent); min-height: 13px; }

.alert { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin-top: 10px; font-size: 13px; }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.danger { background: var(--danger-bg); color: var(--danger); }
.alert b { display: block; font-size: 14px; }
.alert .x { color: var(--fg); opacity: .8; }

.strip { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.wp { flex: none; width: 108px; padding: 9px 10px; border-radius: 14px; background: var(--panel-2); display: grid; gap: 3px; font-size: 12px; border: 1.5px solid transparent; }
.wp.bad { border-color: var(--warn); }
.wp.storm { border-color: var(--danger); }
.wp .t { font: 600 18px var(--font-num); display: flex; align-items: center; gap: 4px; }
.wp .m { color: var(--muted); white-space: nowrap; }
.summary { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: var(--panel-2); font-size: 14px; display: flex; gap: 10px; align-items: center; }
.summary.bad { background: var(--warn-bg); color: var(--warn); }
.summary.storm { background: var(--danger-bg); color: var(--danger); }

#steps { list-style: none; margin: 8px 0 0; padding: 0; }
#steps li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
#steps .d { margin-left: auto; color: var(--muted); font-size: 13px; white-space: nowrap; }

/* Nav banner */
#banner {
  position: fixed; z-index: 1000; left: 12px; right: 12px; top: calc(var(--sat) + 12px);
  background: var(--accent); color: var(--accent-fg); border-radius: 20px; box-shadow: var(--shadow);
  padding: 14px 16px; display: flex; gap: 14px; align-items: center;
}
#banner .arrow { width: 56px; height: 56px; flex: none; }
#banner .dist { font: 700 30px/1 var(--font-num); }
#banner .road { font-size: 17px; font-weight: 500; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
#banner .then { font-size: 12px; opacity: .85; margin-top: 4px; }

/* Map markers */
.me { width: 26px; height: 26px; }
.me .ring { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); opacity: .22; }
.me svg { position: absolute; inset: 3px; }
.wxpin { background: var(--panel); color: var(--fg); border-radius: 12px; box-shadow: var(--shadow); padding: 3px 8px 3px 4px; display: inline-flex; align-items: center; gap: 2px; font: 600 13px var(--font-num); white-space: nowrap; border: 1.5px solid transparent; }
.wxpin.bad { border-color: var(--warn); }
.wxpin.storm { border-color: var(--danger); }
.destpin svg { filter: drop-shadow(0 2px 3px rgba(0,0,0,.35)); }

#toast { position: fixed; z-index: 2000; left: 50%; transform: translateX(-50%); top: calc(var(--sat) + 140px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--line); border-top-color: var(--accent); animation: sp 0.8s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

#layers { position: fixed; z-index: 1100; right: 70px; top: calc(var(--sat) + 132px); background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; width: 230px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; width: 100%; text-align: left; }
.opt:active { background: var(--panel-2); }
.opt .chk { margin-left: auto; width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; }
.opt.on .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.seg { display: flex; background: var(--panel-2); border-radius: 10px; padding: 3px; margin: 6px 4px 2px; }
.seg button { flex: 1; padding: 6px 0; border-radius: 8px; font-size: 13px; }
.seg button.on { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.15); font-weight: 600; }
</style>
</head>
<body>
<div id="map"></div>

<div id="search">
  <div class="field" id="fromRow">
    <span class="dot from"></span>
    <input id="fromInput" placeholder="My location" autocomplete="off" enterkeyhint="next" aria-label="Starting point">
    <button class="icon-btn" id="swapBtn" aria-label="Swap start and destination"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4 3 8M7 4l4 4M17 20V4m0 16-4-4m4 4 4-4"/></svg></button>
  </div>
  <div class="field">
    <span class="dot to"></span>
    <input id="toInput" placeholder="Where to?" autocomplete="off" enterkeyhint="search" aria-label="Destination">
    <button class="icon-btn" id="clearBtn" aria-label="Clear route" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <ul id="suggest" hidden></ul>
</div>

<div id="banner" hidden>
  <svg class="arrow" id="bArrow" viewBox="0 0 48 48"></svg>
  <div style="min-width:0;flex:1">
    <div class="dist num" id="bDist">—</div>
    <div class="road" id="bRoad"></div>
    <div class="then" id="bThen"></div>
  </div>
</div>

<div id="rail">
  <button class="fab" id="layersBtn" aria-label="Map layers"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg></button>
  <button class="fab on" id="radarBtn" aria-label="Toggle radar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 15a4 4 0 0 1 .5-8A5.5 5.5 0 0 1 18 9a3.5 3.5 0 0 1 0 7"/><path d="M9 18l-1 3M13 18l-1 3M17 18l-1 3"/></svg></button>
  <button class="fab" id="locBtn" aria-label="Center on my location"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<div id="layers" hidden>
  <div class="eyebrow" style="padding:6px 10px 2px">Weather overlays</div>
  <button class="opt on" data-layer="radar">Rain radar · past &amp; forecast <span class="chk">✓</span></button>
  <button class="opt" data-layer="traffic">Live traffic <span class="chk">✓</span></button>
  <button class="opt on" data-layer="speedo">Speed &amp; speed limit <span class="chk">✓</span></button>
  <button class="opt on" data-layer="routewx">Weather along route <span class="chk">✓</span></button>
  <button class="opt on" data-layer="alerts">Severe weather alerts <span class="chk">✓</span></button>
  <div class="eyebrow" style="padding:10px 10px 2px">Map style</div>
  <button class="opt" data-layer="satellite">Satellite <span class="chk">✓</span></button>
  <div class="seg" id="themeSeg">
    <button data-t="auto">Auto</button><button data-t="light">Light</button><button data-t="dark">Dark</button>
  </div>
  <div class="eyebrow" style="padding:10px 10px 2px">Voice</div>
  <button class="opt on" data-layer="voice">Spoken directions <span class="chk">✓</span></button>
</div>

<div id="radarBar">
  <button class="play" id="radarPlay" aria-label="Play radar loop"></button>
  <div style="display:grid;gap:3px">
    <div class="row" style="gap:8px"><b class="num" id="radarTime">Radar</b>
      <div class="legend" aria-hidden="true"><span style="background:#04e9e7"></span><span style="background:#019ff4"></span><span style="background:#02fd02"></span><span style="background:#01c501"></span><span style="background:#fdf802"></span><span style="background:#fd9500"></span><span style="background:#fd0000"></span><span style="background:#bc0000"></span><span style="background:#f800fd"></span></div>
    </div>
    <div id="radarTicks"></div>
  </div>
</div>

<div id="updateBar" hidden>
  <span>Update available · v<b id="updVer"></b></span>
  <button id="updGet">Update</button>
  <button id="updClose" aria-label="Dismiss">✕</button>
</div>

<div id="speedHud" hidden>
  <div class="spd"><b id="spdVal">0</b><span>mph</span></div>
  <div class="lim" id="spdLim" hidden><span>SPEED LIMIT</span><b id="limVal">--</b></div>
</div>

<div id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div id="toast" hidden></div>

<script src="leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
